services:
  db:
    image: postgres:16-alpine
    container_name: futebol_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: futebol
      POSTGRES_PASSWORD: futebol
      POSTGRES_DB: futebol_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futebol -d futebol_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
